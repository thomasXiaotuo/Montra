services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: ${SQL_CONTAINER:-sqlserver}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?请先在 .env 中设置 SQL_PASSWORD}
    ports:
      - "127.0.0.1:${SQL_PORT:-1433}:1433"
    volumes:
      - ledger-data:/var/opt/mssql
    restart: unless-stopped
volumes:
  ledger-data:
